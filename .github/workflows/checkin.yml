name: Manual Server Check-in Trigger

# 定时签到由常驻服务在每天 18:00（Asia/Shanghai）自动执行。
# 该工作流仅用于手动触发服务器上的 Webhook，例如服务恢复后补签。
on:
  workflow_dispatch:
    inputs:
      force:
        description: '强制重新签到（即使今天已成功）'
        required: false
        default: false
        type: boolean

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger check-in webhook
        env:
          SERVER_URL: ${{ secrets.SERVER_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ -z "$SERVER_URL" ]; then
            echo "::error::请在仓库 Secrets 中配置 SERVER_URL"
            exit 1
          fi

          echo "触发签到：${SERVER_URL%/}/api/checkin"

          if [ "$FORCE" = "true" ]; then
            curl --fail --silent --show-error --max-time 60 --get \
              --data-urlencode "token=${WEBHOOK_SECRET}" \
              --data-urlencode "force=1" \
              "${SERVER_URL%/}/api/checkin"
          else
            curl --fail --silent --show-error --max-time 60 --get \
              --data-urlencode "token=${WEBHOOK_SECRET}" \
              "${SERVER_URL%/}/api/checkin"
          fi
